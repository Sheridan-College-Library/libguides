<style>
    /* Fix header layout */
    .navbar {
        background-color: #f8f9fa;
        border-bottom: 1px solid #ddd;
    }

    /* Top link row */
    .navbar-sheridan-links {
        display: flex;
        gap: 20px;
        font-size: 0.8rem;
        margin-bottom: 10px;
    }

    .navbar-sheridan-links a {
        text-decoration: none;
        color: #777;
    }

    /* Logo alignment */
    .navbar-brand img {
        height: 40px;
    }

    /* Right-side nav */
    .header-details {
        display: flex;
        align-items: center;
        gap: 25px;
    }

    /* main nav links */
    .header-details a {
        display: flex;
        flex-direction: column;
        /* 👈 stack vertically */
        align-items: center;
        /* center horizontally */
        justify-content: center;
        gap: 4px;

        white-space: nowrap;
        color: #003767;
        text-decoration: none;
        font-size: 0.85rem;
    }

    /* Icons */
    .header-details i {
        font-size: 1.0rem;
    }

    @media (max-width: 992px) {

        /* Let Bootstrap handle collapse layout */
        .navbar .w-100.d-flex.align-items-center {
            flex-wrap: wrap;
        }

        /* Move toggle to right properly */
        .navbar-toggler {
            margin-left: auto;
        }

        /* Expanded menu container */
        .navbar-collapse {
            width: 100%;
            margin-top: 10px;
        }

        /* Fix nav items layout */
        .header-details {
            flex-direction: column;
            /* vertical list */
            align-items: flex-start;
            /* left align */
            gap: 10px;
            width: 100%;
        }

        /* Each link becomes full-width row */
        .header-details a {
            flex-direction: row;
            /* icon LEFT again on mobile */
            justify-content: flex-start;
            gap: 10px;
            width: 100%;
            padding: 6px 0;
        }

        /* Slightly smaller icons */
        .header-details i {
            font-size: 16px;
        }

        /* Hide top utility row spacing issues */
        .navbar-sheridan-links {
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 10px;
        }
    }

    /* Prevent overlap with page content */
    body {
        padding-top: 90px;
    }
</style>
